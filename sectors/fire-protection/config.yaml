    - nsc.org
    - fireprotectionfinder.com
    - birdeye.com
    - expertise.com
    - threebestrated.com

  # Industry directory / association member pages to harvest company
  # links from (manual Methods D & E). Each page is fetched ONCE and all
  # external links become candidates (which then pass the normal
  # qualification pipeline, so junk links get filtered out naturally).
  # Some association directories are JavaScript-driven and yield nothing
  # via plain HTML - harmless to keep listed. Add state license rosters
  # and trade-show exhibitor lists here as you find them; paste-in
  # results pages (with search params in the URL) work too.
  directory_pages:
    - url: https://www.fssa.net/page/MemberDirectory
      note: Fire Suppression Systems Association members
    - url: https://www.afaa.org/mpage/chapters
      note: Automatic Fire Alarm Association chapters (follow to member lists)
    - url: https://nfsa.org/membership/member-directory/
      note: National Fire Sprinkler Association directory
    - url: https://www.firesprinkler.org/AFSA/Membership/Contractor-Locator/AFSA/Contractor-Locator.aspx
      note: American Fire Sprinkler Association contractor locator
    - url: https://www.nafed.org/regions/
      note: National Association of Fire Equipment Distributors regions
    # State licensing rosters (Method E) - examples; extend per state:
    # - url: https://www.tdi.texas.gov/fire/fmli.html
    #   note: Texas State Fire Marshal licensed fire protection companies

  # Method F (research manual): AI-suggested companies. Requires
  # ANTHROPIC_API_KEY in .env; every suggestion is verified by resolving
  # a real website via search, then passes normal screening.
  use_llm_suggestions: true
  llm_suggestions_per_cycle: 10

pipeline:
  # Value for the sheet's "Industry" column.
  industry_label: Fire Protection

  # --- Research-manual thresholds ------------------------------------
  # PPP loans below this are FLAGGED in Notes (the lead is kept).
  # Set to 0 to disable the flag entirely.
  min_ppp_loan: 150000
  # Fire Protection PPP-to-revenue multiplier (manual Step 4 table).
  ppp_revenue_multiplier: 15.4
  # Companies estimating below this revenue are FLAGGED in Notes (not
  # rejected - manual says not to prematurely dismiss).
  min_est_revenue: 5000000

  # A company must match at least min_service_matches of these services
  # (against website text) to qualify. One lone match (e.g. a chimney
  # sweep mentioning "fire safety") is not a fire protection company.
  min_service_matches: 2
  required_services_any:
    - fire alarm
    - fire suppression
    - fire sprinkler
    - fire protection
    - life safety
    - fire extinguisher
    - kitchen hood
    - clean agent
    - smoke detect
    - sprinkler inspection
    - fire safety

  # Skip obvious non-targets (manufacturers, SaaS, training-only, etc.)
  # when these words dominate and no service keyword is present.
  exclude_if_only:
    - software
    - insurance
    - attorney
    - staffing

  # Companies flagged as PE-backed are still stored (with evidence) but
  # marked independent=no and excluded from the sheet when true.
  export_pe_backed: false

  # Run a news/web search per company to look for acquisition evidence
  # (costs one search per company; strongly recommended).
  pe_news_search: true

enrichment:
  hunter: true        # domain search (emails + company data) + email finder
  rocketreach: true   # owner/decision-maker lookup by title
  verify_emails: true # run owner emails through Hunter's verifier; invalid
                      # emails are dropped and the lead marked "Needs Email"
  ppp_web: true       # live PPP lookup (ProPublica/FederalPay) when the
                      # local index has no match; results cached locally
  # Titles that count as "owner" contacts, in priority order.
  owner_titles:
    - owner
    - founder
    - president
    - ceo
    - chief executive
    - principal
    - managing partner
    - general manager
    - vice president

scheduler:
  # Seconds between full discovery cycles (one cycle = a batch of
  # queries + processing everything new that was found).
  cycle_delay_seconds: 300
  # Queries executed per cycle (the rotation pointer persists in the DB,
  # so over many cycles every keyword x region combo is covered).
  queries_per_cycle: 10
  # Politeness delay between outbound HTTP requests (seconds).
  request_delay_seconds: 2
  # Max new companies fully processed (extraction+enrichment) per cycle.
  max_companies_per_cycle: 25

storage:
  database: data/fire-protection.sqlite3
  csv_fallback: out/fire-protection.csv

# Daily M&A sweep queries (scripts/deal_watch.py)
deal_watch:
  queries:
    - '"fire protection" acquisition'
    - '"fire and life safety" acquired'
    - '"fire protection" "private equity"'
    - '"fire safety" company acquisition'
