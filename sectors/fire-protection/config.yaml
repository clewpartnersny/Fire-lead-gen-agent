# =====================================================================
# Fire Protection Lead-Gen Agent — main configuration
#
# This file drives discovery (what to search for and where), the
# processing pipeline, and pacing for 24/7 operation. Rules from the
# client research manual should be encoded here and in pe_firms.yaml.
# =====================================================================

# Sector identity - used by `run-all` and logging.
sector: Fire Protection
persona: Fiona Brandt
enabled: true

# Sheet output: every sector shares the spreadsheet + webhook configured
# in .env and writes to its own worksheet (tab).
output:
  worksheet: "Fire >20"

discovery:
  # Query templates. {keyword} and {region} are substituted from the
  # lists below; every keyword x region combination becomes a search.
  # Varied phrasings surface different companies (manual Method B) -
  # the scheduler rotates through all combinations over time.
  query_templates:
    - '{keyword} company {region}'
    - '{keyword} contractor {region}'
    - '{keyword} services {region}'
    - 'best {keyword} companies {region}'
    - 'family owned {keyword} company {region}'
    - 'commercial {keyword} company {region}'
    - '{keyword} inspection and testing {region}'
    - 'list of {keyword} companies {region}'
    - '{keyword} installation company near {region}'

  # Target profile: independent fire-SPRINKLER contractors (design + install,
  # mostly commercial, recurring inspection/maintenance/24-7 service; many also
  # do backflow, fire alarm, suppression). Sprinkler keywords lead; broader
  # fire-protection terms follow since most sprinkler shops also carry them.
  keywords:
    - fire sprinkler
    - fire sprinkler installation
    - fire sprinkler system
    - fire sprinkler design
    - backflow testing
    - fire suppression
    - fire protection
    - fire alarm
    - life safety

  # Regions to sweep. Start with metros/states you care about; the
  # scheduler rotates through combinations continuously, so a long list
  # is fine — it just takes more cycles to cover.
  regions:
  # TARGETED SPRINKLER-CONTRACTOR PUSH: restricted from the 1,103-region
  # national sweep to these 22 metros (all state-halves of each MSA).
  # To restore national coverage, replace this list from git history.
    - Portland OR
    - Portland WA
    - Oklahoma City OK
    - Tulsa OK
    - Las Vegas NV
    - Memphis TN
    - Memphis MS
    - Memphis AR
    - Dallas-Fort Worth TX
    - Houston TX
    - San Antonio TX
    - Austin TX
    - El Paso TX
    - Kansas City MO
    - Kansas City KS
    - New Orleans LA
    - Baton Rouge LA
    - St. Louis MO
    - St. Louis IL
    - Detroit MI
    - Grand Rapids MI
    - Chicago IL
    - Chicago IN
    - Chicago WI
    - Cincinnati-Dayton OH
    - Cincinnati-Dayton KY
    - Cincinnati-Dayton IN
    - Indianapolis IN
    - Louisville KY
    - Louisville IN
    - Minneapolis MN
    - Minneapolis WI
    - Birmingham AL
  results_per_query: 20

  # Also query Google Places (if GOOGLE_PLACES_API_KEY set) with
  # "{keyword} in {region}" text searches.
  use_places: true

  # Domains that are never company websites (directories, social,
  # marketplaces, news). Candidates from these hosts are dropped.
